services:
  videocutlist:
    image: "${VIDEOCUTLIST_IMAGE:-ghcr.io/ar10dev/videocutlist:latest}"
    env_file: videocutlist.env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    ports:
      - "${VIDEOCUTLIST_BIND_ADDRESS:-127.0.0.1}:${VIDEOCUTLIST_HOST_PORT:-8787}:8787"
    volumes:
      - "${VIDEOCUTLIST_DATA_DIR:-./data}:/var/lib/videocutlist/data"
      - "${VIDEOCUTLIST_CACHE_DIR:-./cache}:/var/cache/videocutlist/previews"
      - "${VIDEOCUTLIST_EXPORT_DIR:-./exports}:/var/lib/videocutlist/exports"
      - "${VIDEOCUTLIST_MEDIA_DIR:-./media}:/srv/videocutlist/media:ro"
    restart: unless-stopped
