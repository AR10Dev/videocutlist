openapi: 3.1.0
info:
  title: EditApp API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        "200": {description: Alive}
  /ready:
    get:
      operationId: ready
      responses:
        "200": {description: Ready}
        "503": {$ref: "#/components/responses/Error"}
  /media:
    get:
      operationId: listMedia
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: Media page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaPage"}
  /media/refresh:
    post:
      operationId: refreshMedia
      responses:
        "202":
          description: Refresh queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
  /media/{mediaId}:
    parameters:
      - {$ref: "#/components/parameters/MediaId"}
    get:
      operationId: getMedia
      responses:
        "200":
          description: Media metadata
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Media"}
        "404": {$ref: "#/components/responses/Error"}
  /media/{mediaId}/preview:
    parameters:
      - {$ref: "#/components/parameters/MediaId"}
      - {name: centerMs, in: query, required: true, schema: {type: integer, minimum: 0}}
      - {name: beforeMs, in: query, schema: {type: integer, minimum: 0}}
      - {name: afterMs, in: query, schema: {type: integer, minimum: 0}}
      - {name: mute, in: query, schema: {type: boolean, default: false}}
    get:
      operationId: streamPreview
      responses:
        "200":
          description: Fragmented MP4 preview
          headers:
            X-Preview-Start: {schema: {type: integer}}
            X-Preview-Duration: {schema: {type: integer}}
            X-Preview-Offset: {schema: {type: integer}}
            X-Preview-Cache: {schema: {type: string, enum: [hit, miss, shared]}}
            X-Request-ID: {schema: {type: string}}
          content:
            video/mp4:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    head:
      operationId: previewStatus
      responses:
        "200": {description: Complete cached preview exists}
        "404": {description: No complete cached preview}
  /projects/{projectId}:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    get:
      operationId: getProject
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      operationId: putProject
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectInput"}
      responses:
        "200":
          description: Saved project
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /projects/{projectId}/exports:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    post:
      operationId: createExport
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExportInput"}
      responses:
        "202":
          description: Export queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /jobs/{jobId}:
    parameters:
      - {$ref: "#/components/parameters/JobId"}
    get:
      operationId: getJob
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      operationId: cancelJob
      responses:
        "204": {description: Cancelled or already terminal}
        "404": {$ref: "#/components/responses/Error"}
components:
  parameters:
    MediaId: {name: mediaId, in: path, required: true, schema: {type: string, pattern: "^m_[A-Za-z0-9_-]{43}$"}}
    ProjectId: {name: projectId, in: path, required: true, schema: {type: string, pattern: "^p_[A-Za-z0-9_-]{12,64}$"}}
    JobId: {name: jobId, in: path, required: true, schema: {type: string, pattern: "^j_[A-Za-z0-9_-]{12,64}$"}}
  responses:
    Error:
      description: Safe error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
    Media:
      type: object
      required: [id, name, durationMs, sizeBytes, container, streams, etag]
      properties:
        id: {type: string}
        name: {type: string}
        durationMs: {type: integer}
        sizeBytes: {type: integer}
        container: {type: string}
        streams: {type: object, additionalProperties: true}
        etag: {type: string}
    MediaPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Media"}}
        nextCursor: {type: [string, "null"]}
    ProjectInput:
      type: object
      required: [mediaId, revision, segments, uiState]
      properties:
        mediaId: {type: string}
        revision: {type: integer, minimum: 0}
        segments: {type: array, items: {$ref: "#/components/schemas/Segment"}}
        uiState: {$ref: "#/components/schemas/UIState"}
    Project:
      allOf:
        - {$ref: "#/components/schemas/ProjectInput"}
        - type: object
          required: [id, updatedAt]
          properties:
            id: {type: string}
            updatedAt: {type: string, format: date-time}
    Segment:
      type: object
      required: [startMs, endMs]
      properties:
        startMs: {type: integer, minimum: 0}
        endMs: {type: integer, minimum: 1}
        label: {type: string, maxLength: 200}
    UIState:
      type: object
      required: [playheadMs, zoom, muted]
      properties:
        playheadMs: {type: integer, minimum: 0}
        zoom: {type: number, exclusiveMinimum: 0}
        muted: {type: boolean}
    ExportInput:
      type: object
      additionalProperties: false
      required: [mode, cutStrategy, container]
      properties:
        mode: {type: string, enum: [merge]}
        cutStrategy: {type: string, enum: [stream_copy_preferred]}
        container: {type: string, enum: [mkv]}
        smartBoundaryReencode: {type: boolean, const: false, default: false}
    Job:
      type: object
      required: [id, type, state, createdAt, updatedAt]
      properties:
        id: {type: string}
        type: {type: string, enum: [media_refresh, export]}
        state: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        progress: {type: number, minimum: 0, maximum: 1}
        warnings: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

