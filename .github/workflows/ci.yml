name: CI

on:
    push:
        branches:
            - main
    pull_request:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-go@v7.0.0
              with:
                  go-version: "1.26.6"
            - uses: pnpm/action-setup@v6.0.10
              with:
                  version: 10.34.5
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version: "26.7.0"
                  cache: pnpm
                  cache-dependency-path: client/pnpm-lock.yaml
            - run: pnpm --dir client install --frozen-lockfile
            - run: pnpm --dir client audit --audit-level high
            - run: make check

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: pnpm/action-setup@v6.0.10
              with:
                  version: 10.34.5
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version: "26.7.0"
                  cache: pnpm
                  cache-dependency-path: client/pnpm-lock.yaml
            - run: pnpm --dir client install --frozen-lockfile
            - run: pnpm --dir client exec playwright install-deps chromium
            - run: pnpm --dir client exec playwright install --only-shell chromium
            - run: make e2e
