name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.5"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "26.5.0"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm --prefix client ci
      - run: npm --prefix client exec playwright install --with-deps chromium
      - run: make smoke
