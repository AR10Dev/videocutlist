name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.37.7
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3.37.7
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3.37.7
        with:
          category: /language:${{ matrix.language }}
