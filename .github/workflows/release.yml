name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ar10dev/videocutlist
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.5"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "26.5.0"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm --dir client install --frozen-lockfile
      - run: make check

  publish-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.3.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        shell: bash
        run: |
          set -euo pipefail
          version_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $version_pattern ]]; then
            echo "Invalid version tag: $TAG" >&2
            exit 1
          fi
          docker build \
            --file deployments/containers/Dockerfile \
            --tag "$IMAGE:$TAG" \
            .
          docker push "$IMAGE:$TAG"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

  publish-release:
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" || \
            gh release create "$TAG" --title "$TAG" --generate-notes
